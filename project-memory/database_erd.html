
<div id="erd" style="padding: 8px 0"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  profiles {
    uuid id PK
    text role
    text name
    text bio
    timestamp created_at
  }
  groups {
    uuid id PK
    uuid teacher_id FK
    text name
    text description
    timestamp created_at
  }
  group_members {
    uuid group_id FK
    uuid student_id FK
    timestamp joined_at
  }
  questions {
    uuid id PK
    uuid author_id FK
    text content
    jsonb options
    text correct_answer
    text source
    timestamp created_at
  }
  exams {
    uuid id PK
    uuid group_id FK
    text title
    timestamp starts_at
    timestamp ends_at
  }
  exam_questions {
    uuid exam_id FK
    uuid question_id FK
    int sort_order
  }
  submissions {
    uuid id PK
    uuid exam_id FK
    uuid student_id FK
    int score
    timestamp submitted_at
  }
  submission_answers {
    uuid id PK
    uuid submission_id FK
    uuid question_id FK
    text answer
    bool is_correct
  }
  posts {
    uuid id PK
    uuid teacher_id FK
    text content
    timestamp created_at
  }
  reactions {
    uuid id PK
    uuid post_id FK
    uuid user_id FK
    text type
  }
  comments {
    uuid id PK
    uuid post_id FK
    uuid user_id FK
    text content
    timestamp created_at
  }
  public_exam_sets {
    uuid id PK
    uuid admin_id FK
    text title
    text description
  }

  profiles ||--o{ groups : teaches
  groups ||--o{ group_members : has
  profiles ||--o{ group_members : enrolled
  profiles ||--o{ questions : writes
  groups ||--o{ exams : contains
  exams ||--o{ exam_questions : uses
  questions ||--o{ exam_questions : included_in
  exams ||--o{ submissions : receives
  profiles ||--o{ submissions : submits
  submissions ||--o{ submission_answers : has
  questions ||--o{ submission_answers : answered_by
  profiles ||--o{ posts : publishes
  posts ||--o{ reactions : receives
  posts ||--o{ comments : receives
  public_exam_sets ||--o{ exam_questions : reused_in
`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
</script>
